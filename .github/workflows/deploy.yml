name: Build & Deploy Hugo Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || vars.SITE_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "Building with custom domain: https://$CUSTOM_DOMAIN/"
            hugo --minify --baseURL "https://$CUSTOM_DOMAIN/"
          else
            hugo --minify
          fi

      - name: Deploy to Cloudflare Pages (Optional Actions Deploy)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT_NAME="${{ vars.CLOUDFLARE_PROJECT_NAME || 'hugo-for-obsidian' }}"
          npx wrangler pages project create "$PROJECT_NAME" --production-branch=main || true
          npx wrangler pages deploy public --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true

      - name: Zero-Secret Deployment Notice
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "================================================================================="
          echo "  Site build verified successfully!"
          echo "  No CLOUDFLARE_API_TOKEN detected in GitHub Secrets."
          echo "  Continuous deployment is handled natively by Cloudflare Pages Git integration."
          echo "  No Cloudflare secrets or API keys are required in GitHub."
          echo "================================================================================="
