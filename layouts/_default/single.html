{{ define "main" }}
{{ $pageTitle := or .Title .File.BaseFileName }}
<div class="note-container">
  {{ partial "breadcrumbs.html" . }}

  <article class="clinical-note">
    <div class="note-body-wrapper">
      <div class="note-content cm-s-obsidian">
        {{ partial "obsidian-content.html" . }}
        {{ partial "footer.html" . }}
      </div>

      {{ partial "toc.html" . }}
    </div>
  </article>
</div>

<!-- On-Demand Mermaid Loader with Custom Theme Tokens & Re-render Support -->
<script>
  window.renderMermaidDiagrams = function() {
    if (typeof mermaid === 'undefined') return;
    const isDark = document.body.classList.contains('theme-dark');
    
    const darkThemeVariables = {
      darkMode: true,
      background: 'transparent',
      primaryColor: '#1e293b',
      primaryTextColor: '#f3f4f6',
      primaryBorderColor: '#00a868',
      lineColor: '#9ca3af',
      secondaryColor: '#0f172a',
      tertiaryColor: '#1e293b',
      nodeBorder: '#3b82f6',
      clusterBkg: 'rgba(255, 255, 255, 0.04)',
      clusterBorder: '#475569',
      edgeLabelBackground: '#1e293b',
      fontFamily: 'system-ui, -apple-system, sans-serif'
    };

    const lightThemeVariables = {
      darkMode: false,
      background: 'transparent',
      primaryColor: '#f1f5f9',
      primaryTextColor: '#0f172a',
      primaryBorderColor: '#00a868',
      lineColor: '#475569',
      secondaryColor: '#e2e8f0',
      tertiaryColor: '#f8fafc',
      nodeBorder: '#00a868',
      clusterBkg: 'rgba(0, 0, 0, 0.03)',
      clusterBorder: '#cbd5e1',
      edgeLabelBackground: '#ffffff',
      fontFamily: 'system-ui, -apple-system, sans-serif'
    };

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: isDark ? darkThemeVariables : lightThemeVariables,
      securityLevel: 'loose'
    });

    document.querySelectorAll('.mermaid').forEach(function(el) {
      if (!el.getAttribute('data-original-code')) {
        el.setAttribute('data-original-code', el.textContent
          .replace(/&#34;/g, '"')
          .replace(/&quot;/g, '"')
          .replace(/&gt;/g, '>')
          .replace(/&lt;/g, '<')
          .replace(/&amp;/g, '&'));
      }
      el.removeAttribute('data-processed');
      el.textContent = el.getAttribute('data-original-code');
    });

    mermaid.run({ querySelector: '.mermaid' });
  };

  if (document.querySelector('.mermaid')) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
    s.onload = function() {
      window.renderMermaidDiagrams();
    };
    document.head.appendChild(s);
  }

  // Print function matching PediaNotes standards
  function doPrint() {
    var content = document.querySelector('.note-content');
    if (!content) { window.print(); return; }

    // Clone content and remove site footer element from print output
    var clone = content.cloneNode(true);
    var footerEl = clone.querySelector('.site-footer');
    if (footerEl) footerEl.remove();

    var printWindow = window.open('', '_blank', 'width=900,height=700');
    var isDark = document.body.classList.contains('theme-dark');
    var pediaColor = isDark ? '#1E3A8A' : '#1E3A8A';
    var notesColor = isDark ? '#9D174D' : '#9D174D';

    var now = new Date();
    var dateStr = now.toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric' });
    var timeStr = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false });
    var pageUrl = window.location.href;

    printWindow.document.write(
      '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>' + document.title + '</title>' +
      '<style>' +
      '* { box-sizing: border-box; margin: 0; padding: 0; }' +
      '@page { margin: 12mm 18mm 15mm; @bottom-center { content: "Page " counter(page) " of " counter(pages); font-family: Arial, sans-serif; font-size: 8pt; color: #666; } }' +
      'body { font-family: Georgia, serif; font-size: 11pt; line-height: 1.5; color: #000; background: #fff; padding: 18mm 18mm 15mm; }' +
      'h1, h2, h3, h4 { font-family: Arial, sans-serif !important; color: #059669 !important; margin: 0.8em 0 0.4em !important; page-break-after: avoid !important; font-weight: 700 !important; }' +
      'h1 { font-size: 15pt !important; border-bottom: 2px solid #a7f3d0 !important; padding-bottom: 3px !important; }' +
      'h2 { font-size: 13pt !important; border-bottom: 1px solid #e2e8f0 !important; padding-bottom: 2px !important; }' +
      'h3 { font-size: 11pt !important; }' +
      'h4 { font-size: 10pt !important; }' +
      'a, .internal-link { color: #059669 !important; text-decoration: underline !important; text-underline-offset: 2px !important; font-weight: 600 !important; }' +
      'table { border-collapse: collapse !important; width: 100% !important; margin: 1em 0 !important; font-size: 9.5pt !important; }' +
      'table th, table td { border: 1px solid #cbd5e1 !important; padding: 6px 10px !important; text-align: left !important; vertical-align: top !important; }' +
      'table th { background-color: #ecfdf5 !important; color: #065f46 !important; font-weight: 700 !important; }' +
      'table tr:nth-child(even) td { background-color: #f8fafc !important; }' +
      '.callout { border: 1px solid #cbd5e1 !important; border-left: 4px solid #059669 !important; padding: 8px 12px !important; margin: 1em 0 !important; background: #f0fdf4 !important; border-radius: 6px !important; }' +
      '.callout[data-callout="danger"], .callout[data-callout="warning"] { border-left-color: #dc2626 !important; background: #fef2f2 !important; }' +
      '.callout[data-callout="info"], .callout[data-callout="note"] { border-left-color: #2563eb !important; background: #eff6ff !important; }' +
      'mark, .search-mark { background-color: #d1fae5 !important; color: #065f46 !important; padding: 1px 4px !important; border-radius: 3px !important; }' +
      '.site-footer, .footer-container, .copyright, .disclaimer { display: none !important; }' +
      '.mermaid { display: block !important; width: 100% !important; max-width: 100% !important; max-height: 220mm !important; height: auto !important; margin: 1em 0 !important; page-break-inside: avoid !important; break-inside: avoid !important; }' +
      '.mermaid svg { display: block !important; max-width: 100% !important; max-height: 215mm !important; height: auto !important; width: auto !important; margin: 0 auto !important; }' +
      '.mermaid .node rect, .mermaid .node polygon, .mermaid .node circle, .mermaid .node ellipse, .mermaid .node path { fill: #f8fafc !important; stroke: #00a868 !important; stroke-width: 1.5px !important; }' +
      '.mermaid .node .label, .mermaid .node text, .mermaid .node span, .mermaid .node div, .mermaid .node p { color: #0f172a !important; fill: #0f172a !important; font-family: Arial, sans-serif !important; }' +
      '.mermaid .flowchart-link { fill: none !important; stroke: #334155 !important; stroke-width: 1.5px !important; }' +
      '.mermaid .marker { fill: #334155 !important; stroke: #334155 !important; }' +
      '.mermaid .edgeLabel { color: #0f172a !important; fill: #0f172a !important; }' +
      '.mermaid .edgeLabel rect { fill: #ffffff !important; opacity: 0.95; stroke: #cbd5e1 !important; }' +
      '.mermaid .cluster rect { fill: rgba(0, 0, 0, 0.03) !important; stroke: #cbd5e1 !important; }' +
      '.mermaid .cluster text, .mermaid .cluster span { color: #475569 !important; fill: #475569 !important; }' +
      '.print-page-header { position: fixed; top: 0; left: 0; right: 0; height: 14mm; display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 2px 18mm; border-bottom: 1px solid #e2e8f0; }' +
      '.print-header-left .site-name { font-family: Arial, sans-serif; font-size: 12pt; font-weight: bold; }' +
      '.print-header-right { font-family: Arial, sans-serif; font-size: 7.5pt; color: #475569; text-align: right; line-height: 1.2; }' +
      '@media print { body { padding: 0; margin: 0; } }' +
      '.header-space { height: 14mm; }' +
      '.content-table { width: 100% !important; border: none !important; border-collapse: collapse !important; }' +
      '.content-table > thead > tr > td, .content-table > tbody > tr > td { border: none !important; padding: 0 !important; background: transparent !important; }' +
      '</style></head><body>' +
      '<div class="print-page-header">' +
        '<div class="print-header-left"><span class="site-name"><span style="color:' + pediaColor + ';">Pedia</span><span style="color:' + notesColor + ';">Notes</span></span></div>' +
        '<div class="print-header-right"><div>' + pageUrl + '</div><div>' + dateStr + ' ' + timeStr + ' IST</div><div style="font-weight:bold;">Dr. Rubanbalaji</div></div>' +
      '</div>' +
      '<table class="content-table"><thead><tr><td><div class="header-space">&nbsp;</div></td></tr></thead><tbody><tr><td>' +
      clone.innerHTML +
      '</td></tr></tbody></table></body></html>'
    );
    printWindow.document.close();
    printWindow.onload = function() {
      printWindow.focus();
      printWindow.print();
      printWindow.onafterprint = function() { printWindow.close(); };
    };
  }

  // Intercept Ctrl+P / Cmd+P to invoke custom PediaNotes doPrint modal
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
      e.preventDefault();
      if (typeof doPrint === 'function') {
        doPrint();
      } else {
        window.print();
      }
    }
  });
</script>
{{ end }}
