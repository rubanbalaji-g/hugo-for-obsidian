{{ with site.Params.footerContent }}
<footer class="site-footer">
  <div class="footer-container">
    {{ if eq site.Params.footerFormat "html" }}
      <div class="footer-custom-html">
        {{ . | safeHTML }}
      </div>
    {{ else }}
      <div class="footer-custom-markdown">
        {{ . | markdownify }}
      </div>
    {{ end }}
  </div>
</footer>
{{ end }}
